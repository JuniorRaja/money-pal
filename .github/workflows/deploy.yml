name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A migration push racing a second one is worse than a queued deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # supabase/migrations/ is the live schema, applied in filename order.
      # --db-url pushes directly without `supabase link` or an access token.
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # VITE_* are inlined into the client bundle at build time; the unprefixed
      # ones become non-secret Worker vars via nitro.config.ts's cloudflare.wrangler.vars.
      # Same values as their VITE_ counterparts (.env.example: "same project, two
      # spellings"), so reuse those secrets instead of asking for the value twice.
      - name: Build
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_module
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      # `secrets:` pushes each via `wrangler secret put`, encrypted on Cloudflare's
      # side — never written into wrangler.json. An unset AI key pushes as "",
      # which the app already treats as absent (see assistant.functions.ts).
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .output/server
          command: deploy
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            ANTHROPIC_API_KEY
            OPENROUTER_API_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
